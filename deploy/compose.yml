# 서버 한 대에 앱·PostgreSQL·HTTPS(Caddy)·주기 작업을 함께 띄운다(앱 설계서 3.3). 값은 같은 폴더의 .env(server-setup.sh 가 만듦).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shop
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      retries: 20

  app:
    # 이미지는 GitHub Actions 에서 빌드해 옮긴다(deploy-test.yml). 서버에서 빌드하지 않는다.
    image: auto-body-shop-app:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://shop:${DB_PASSWORD}@db:5432/shop
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - app

  jobs:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment:
      JOBS_TOKEN: ${JOBS_TOKEN}
      TZ: KST-9
    volumes:
      - ./jobs.sh:/jobs.sh:ro
    entrypoint: ["sh", "/jobs.sh"]
    depends_on:
      - app

volumes:
  db:
  files:
  caddy:
