# 서버 한 대에 앱·PostgreSQL·HTTPS(Caddy)·주기 작업을 함께 띄운다(앱 설계서 3.3). 값은 같은 폴더의 .env(server-setup.sh 가 만듦).
# 프로그램 출력(docker logs)은 10MB 씩 3개만 남긴다. 그대로 두면 끝없이 쌓여 SSD 를 채운다(대표 2026-11-20 '오류 기록')
x-logging: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging: *log
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shop
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      retries: 20

  app:
    # 이미지는 GitHub Actions 에서 빌드해 옮긴다(deploy-test.yml). 서버에서 빌드하지 않는다.
    image: auto-body-shop-app:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    logging: *log
    # 앱에는 쓰는 값만 넘긴다(대표 2026-11-21). 클라우드플레어·터널 토큰, 백업 암호 등은 앱이 뚫려도 새지 않게 넘기지 않는다.
    # 앱 코드에서 새 환경값(process.env.…)을 쓰면 여기에도 꼭 더할 것(tests/unit/compose-env.test.ts 가 확인)
    environment:
      DATABASE_URL: postgres://shop:${DB_PASSWORD}@db:5432/shop
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      SENSITIVE_ENCRYPTION_KEY: ${SENSITIVE_ENCRYPTION_KEY:-}
      JOBS_TOKEN: ${JOBS_TOKEN:-}
      APP_URL: ${APP_URL:-}
      TRUST_CF_IP: ${TRUST_CF_IP:-}
      SERVER_ON_SITE: ${SERVER_ON_SITE:-}
      SERVER_LAN_CIDR: ${SERVER_LAN_CIDR:-}
      DEMO_SEED: ${DEMO_SEED:-}
      INIT_OWNER_LOGIN: ${INIT_OWNER_LOGIN:-}
      INIT_OWNER_PASSWORD: ${INIT_OWNER_PASSWORD:-}
      INIT_OWNER_NAME: ${INIT_OWNER_NAME:-}
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *log
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - app

  jobs:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    logging: *log
    environment:
      JOBS_TOKEN: ${JOBS_TOKEN}
      TZ: KST-9
    volumes:
      - ./jobs.sh:/jobs.sh:ro
    entrypoint: ["sh", "/jobs.sh"]
    depends_on:
      - app

volumes:
  db:
  files:
  caddy:
