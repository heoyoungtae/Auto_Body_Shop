# 사업장 미니 PC(ASUS NUC14MLK15, Ubuntu 24.04)용. 오라클 테스트 서버의 compose.yml 과 달리
# - 앱 이미지를 미니 PC 에서 직접 빌드한다(update.sh, 밤에 자동).
# - 밖에서 들어오는 길은 클라우드플레어 터널(tunnel) 또는 '국내 직접 접속'(caddy, 공유기 443) 중 하나다(minipc/direct.sh).
# - 앱은 이 PC 안(127.0.0.1:3000)에서만 바로 열 수 있다. 인터넷이 끊겨도 미니 PC 화면에서는 http://localhost:3000 으로 쓸 수 있다.
# 값은 같은 폴더의 .env(minipc/install.sh 가 만듦). .env 의 COMPOSE_FILE=compose.minipc.yml 덕분에 docker compose 명령이 이 파일을 쓴다.
# 프로그램 출력(docker logs)은 10MB 씩 3개만 남긴다. 그대로 두면 끝없이 쌓여 SSD 를 채운다(대표 2026-11-20 '오류 기록')
x-logging: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    logging: *log
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shop
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      retries: 20

  app:
    image: auto-body-shop-app:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    logging: *log
    # 앱에는 쓰는 값만 넘긴다(대표 2026-11-21). 클라우드플레어·터널 토큰, 백업 암호 등은 앱이 뚫려도 새지 않게 넘기지 않는다.
    # 앱 코드에서 새 환경값(process.env.…)을 쓰면 여기에도 꼭 더할 것(tests/unit/compose-env.test.ts 가 확인)
    environment:
      DATABASE_URL: postgres://shop:${DB_PASSWORD}@db:5432/shop
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      SENSITIVE_ENCRYPTION_KEY: ${SENSITIVE_ENCRYPTION_KEY:-}
      JOBS_TOKEN: ${JOBS_TOKEN:-}
      APP_URL: ${APP_URL:-}
      # 홈페이지 주소(쉼표로 여럿, 예: jmotors.co.kr,www.jmotors.co.kr). 비우면 홈페이지 주소 없음
      HOMEPAGE_HOST: ${HOMEPAGE_HOST:-}
      TRUST_CF_IP: ${TRUST_CF_IP:-}
      SERVER_ON_SITE: ${SERVER_ON_SITE:-}
      SERVER_LAN_CIDR: ${SERVER_LAN_CIDR:-}
      DEMO_SEED: ${DEMO_SEED:-}
      INIT_OWNER_LOGIN: ${INIT_OWNER_LOGIN:-}
      INIT_OWNER_PASSWORD: ${INIT_OWNER_PASSWORD:-}
      INIT_OWNER_NAME: ${INIT_OWNER_NAME:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy

  # 클라우드플레어 터널. 토큰(TUNNEL_TOKEN)은 클라우드플레어 화면에서 받아 .env 에 넣는다(설명서 3단계).
  # 토큰이 없으면 이 칸만 멈춰 있고 앱은 미니 PC 안에서 그대로 쓸 수 있다.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: *log
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - app

  # '국내 직접 접속'(minipc/direct.sh on)일 때만 켠다(.env 의 COMPOSE_PROFILES=direct). 공유기에서 443 을 이 PC 로 열어 둔다.
  # 클라우드플레어 무료 요금제가 한국 접속을 미국으로 돌려 느려지는 것을 피한다. 인증서는 Caddy 가 저절로 받는다.
  caddy:
    image: caddy:2
    profiles: ["direct"]
    restart: unless-stopped
    logging: *log
    ports:
      - "443:443"
      # http:// 로 열면 https:// 로 넘기기만 한다(대표 2026-11-22). 공유기에서 80 도 이 PC 로 열어야 밖에서 쓰인다
      - "80:80"
    environment:
      SITE_HOST: ${SITE_HOST}
    volumes:
      - ./Caddyfile.direct:/etc/caddy/Caddyfile:ro
      # 홈페이지 주소(minipc/homepage.sh)
      - ./caddy-sites:/etc/caddy/sites:ro
      - caddy:/data
    depends_on:
      - app

  jobs:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    logging: *log
    environment:
      JOBS_TOKEN: ${JOBS_TOKEN}
      TZ: KST-9
    volumes:
      - ./jobs.sh:/jobs.sh:ro
    entrypoint: ["sh", "/jobs.sh"]
    depends_on:
      - app

volumes:
  db:
  files:
  caddy:
